{% extends "layout.html" %}{% block content %}<section class="page-section"><div class="container hotel-admin-editor"><div class="admin-header"><div><a href="/admin/blog-posts">← Articles</a><h1>{{ 'Edit Article' if post else 'Create Article' }}</h1></div></div>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="contact-form hotel-admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="hotel-admin-grid"><label>Title *<input name="title" required value="{{ post.title if post else '' }}"></label><label>URL slug<input name="slug" value="{{ post.slug if post else '' }}"></label><label>Category<input name="category" value="{{ post.category if post else 'Travel' }}"></label><label>Author<input name="author" value="{{ post.author if post else 'Waadi Kashmir Travels' }}"></label></div><label>Excerpt *<textarea name="excerpt" required rows="3">{{ post.excerpt if post else '' }}</textarea></label><label>Introduction *<textarea name="content" required rows="6">{{ post.content if post else '' }}</textarea></label><label>Hero image URL<input name="image_url" value="{{ post.image_url if post else '' }}"></label><label>Upload hero image<input name="image_file" type="file" accept="image/*,.avif"></label><div class="hotel-admin-grid"><label>SEO title<input name="meta_title" value="{{ post.meta_title if post else '' }}"></label><label>SEO description<textarea name="meta_description" rows="2">{{ post.meta_description if post else '' }}</textarea></label></div><fieldset class="blog-section-editor"><legend>Article sections</legend><div id="blogSections">{% for section in sections %}<div class="blog-admin-section"><input name="section_heading" value="{{ section.heading }}" placeholder="Section heading"><textarea name="section_body" rows="4" placeholder="Section content">{{ section.body }}</textarea></div>{% endfor %}</div><button type="button" class="btn btn-outline" id="addBlogSection">Add section</button></fieldset><label class="checkbox-inline"><input type="checkbox" name="published" {% if not post or post.published %}checked{% endif %}> Published</label><button class="btn">Save Article</button></form></div></section><script>document.getElementById('addBlogSection').addEventListener('click',()=>document.getElementById('blogSections').insertAdjacentHTML('beforeend','<div class="blog-admin-section"><input name="section_heading" placeholder="Section heading"><textarea name="section_body" rows="4" placeholder="Section content"></textarea></div>'))</script>{% endblock %}
