{% extends "layout.html" %}

{% block content %}
<section class="page-section">
  <div class="container">
    <h1>Admin: Inquiries</h1>
    <div class="admin-table">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          {% for inquiry in inquiries %}
          <tr>
            <td>{{ inquiry.id }}</td>
            <td>{{ inquiry.name }}</td>
            <td>{{ inquiry.email }}</td>
            <td>{{ inquiry.message }}</td>
            <td>{{ inquiry.created_at.strftime('%Y-%m-%d') }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
