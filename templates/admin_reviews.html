{% extends "layout.html" %}{% block content %}<section class="page-section"><div class="container"><div class="admin-header"><div><a href="/admin">← Dashboard</a><h1>Guest Reviews</h1></div></div><form method="post" class="contact-form hotel-admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="hotel-admin-grid"><label>Guest name<input name="guest_name" required></label><label>Guest location<input name="location"></label><label>Trip label<input name="trip_label" placeholder="Family Kashmir Tour"></label><label>Rating<select name="rating">{% for n in range(5,0,-1) %}<option>{{ n }}</option>{% endfor %}</select></label></div><label>Genuine review text<textarea name="review_text" required rows="4"></textarea></label><label class="checkbox-inline"><input type="checkbox" name="published" checked> Published</label><button class="btn">Add Review</button></form><div class="admin-table"><table><tbody>{% for review in reviews %}<tr><td><strong>{{ review.guest_name }}</strong><br>{{ '★' * review.rating }}</td><td>{{ review.review_text }}</td><td><form method="post" action="/admin/reviews/{{ review.id }}/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="admin-link-danger" onclick="return confirm('Delete review?')">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
