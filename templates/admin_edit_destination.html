{% extends "layout.html" %}

{% block content %}
<section class="page-section">
  <div class="container contact-page">
    <div>
      <h1>{{ "Edit Destination" if destination else "Create Destination" }}</h1>
      <form action="" method="post" enctype="multipart/form-data" class="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ destination.name if destination else '' }}" required />

        <label for="region">Region</label>
        <input id="region" name="region" type="text" value="{{ destination.region if destination else '' }}" required />

        <label for="best_time">Best Time</label>
        <input id="best_time" name="best_time" type="text" value="{{ destination.best_time if destination else '' }}" required />

        <label for="image_url">Destination Image URL</label>
        <input id="image_url" name="image_url" type="url" value="{{ destination.image_url if destination else '' }}" placeholder="Paste image URL or choose from media manager" />

        <label for="image_file" style="margin-top: 12px;">Upload a new image</label>
        <input id="image_file" name="image_file" type="file" accept="image/*" />

        {% if media_images %}
        <div style="margin-top: 12px;">
          <h4>Choose from uploaded media</h4>
          <div style="display:flex; flex-wrap:wrap; gap:10px;">
            {% for image in media_images %}
            <button type="button" onclick="document.getElementById('image_url').value='{{ image }}';" style="border: 1px solid #ddd; background: #fff; padding: 6px; border-radius: 8px; cursor:pointer;">
              <img src="{{ image }}" alt="Media thumbnail" style="width: 90px; height: 60px; object-fit: cover; border-radius: 6px;" />
            </button>
            {% endfor %}
          </div>
        </div>
        {% endif %}

        {% if destination and destination.image_url %}
        <div style="margin-top: 10px;">
          <img src="{{ destination.image_url }}" alt="Current destination image" style="width: 100%; max-width: 280px; border-radius: 10px; object-fit: cover;" />
        </div>
        {% endif %}

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" required>{{ destination.description if destination else '' }}</textarea>

        <label for="highlights">Highlights (one per line)</label>
        <textarea id="highlights" name="highlights" rows="5" placeholder="One highlight per line">{{ highlights_text }}</textarea>

        <button class="btn" type="submit">Save Destination</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
